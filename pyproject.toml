[project]
name = "wolven-hunt"
version = "0.1.0"
description = "Wolven Hunt: deterministic 10-player AI werewolf engine."
requires-python = ">=3.11"
authors = [{ name = "Wolven Hunt Team" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "litellm>=1.50,<2",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6.0,<7",
  "sse-starlette>=2.1,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "hypothesis>=6.100,<7",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML",
]

[project.scripts]
wolven-hunt = "wolven_hunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolven_hunt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wolven_hunt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: deterministic golden trace tests",
  "property: hypothesis property tests",
  "leakage: PlayerView leakage tests",
  "llm: LLM gateway and mock-provider tests",
]
